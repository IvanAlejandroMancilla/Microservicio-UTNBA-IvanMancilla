spring:
  application:
    name: PoryectoDiplomatura

  datasource:
    url: jdbc:mysql://localhost:3306/poryectodiplomaturaapplication?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
